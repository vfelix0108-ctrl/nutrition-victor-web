
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi nutrición</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 460px;
      margin: 40px auto;
      padding: 20px;
      color: #222;
    }
    section {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 20px;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
    }
    #app { display: none; }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Mi nutrición</h1>

  <section id="login">
    <h2>Iniciar sesión</h2>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Correo electrónico"
        autocomplete="username" required>
      <input id="password" type="password" placeholder="Contraseña"
        autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
  </section>

  <section id="app">
    <h2>Sesión iniciada</h2>
    <p id="user"></p>
    <p>La autenticación funciona. Aún no se han habilitado los registros de alimentos.</p>
    <button id="logout">Cerrar sesión</button>
  </section>

  <p id="status" role="status"></p>

  <script>
    const SUPABASE_URL = "este es el url porject https://wahvfaxnyrfvzfqcpgox.supabase.co";
    const SUPABASE_KEY = "sb_publishable_77mheVKgHCL8_34Gg1uciw_7omWRPgO";

    const status = document.getElementById("status");
    const login = document.getElementById("login");
    const app = document.getElementById("app");

    if (!window.supabase ||
        SUPABASE_URL.includes("PEGA_AQUI") ||
        SUPABASE_KEY.includes("PEGA_AQUI")) {
      status.textContent = "Configura la URL y la clave pública de Supabase.";
    } else {
      const client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: false
          }
        }
      );

      async function renderSession() {
        const { data, error } = await client.auth.getSession();
        if (error) {
          status.textContent = "No se pudo comprobar la sesión.";
          return;
        }

        const session = data.session;
        login.style.display = session ? "none" : "block";
        app.style.display = session ? "block" : "none";
        document.getElementById("user").textContent =
          session ? "Conectado como: " + session.user.email : "";
      }

      document.getElementById("loginForm").addEventListener(
        "submit", async (event) => {
          event.preventDefault();
          status.textContent = "Comprobando acceso...";

          const { error } = await client.auth.signInWithPassword({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          });

          if (error) {
            status.textContent =
              "Error de Supabase: " + error.message;
            return;
          }

          document.getElementById("password").value = "";
          status.textContent = "Acceso correcto.";
          await renderSession();
        }
      );

      document.getElementById("logout").addEventListener(
        "click", async () => {
          const { error } = await client.auth.signOut();
          status.textContent = error
            ? "No se pudo cerrar la sesión."
            : "Sesión cerrada.";
          await renderSession();
        }
      );

      client.auth.onAuthStateChange(() => {
        renderSession();
      });

      renderSession();
    }
  </script>
</body>
</html>
